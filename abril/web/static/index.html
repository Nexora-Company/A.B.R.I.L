<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4B0082">
  <title>Abril — asistente personal</title>
  <style>
    :root {
      color-scheme: dark;
      --indigo: #4B0082;
      --indigo-2: #6a1bb0;
      --bg: #0d0716;
      --panel: #150c25;
      --panel-2: #1f1235;
      /* --line: #2f1d4d; */
      --text: #ede7f8;
      --muted: #9a8cb6;
      --green: #c9a6ff;
      --green-2: #8b3fd6;
      --danger: #ff9e91;
      --shadow: 0 28px 80px #0008
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 52% -15%, #4B008260 0, transparent 43%), var(--bg);
      color: var(--text);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .005em
    }

    button,
    textarea {
      font: inherit
    }

    button {
      color: inherit;
      cursor: pointer
    }

    .app {
      width: min(1060px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 24px 28px 22px;
      display: flex;
      flex-direction: column
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0 20px;
      border-bottom: 1px solid #ffffff12
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid #c9a6ff55;
      border-radius: 13px;
      color: var(--green);
      font: 600 20px Georgia, serif;
      box-shadow: inset 0 0 18px #c9a6ff12
    }

    .brand-name {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: .03em
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .action-btn {
      background: #240f3f;
      border: 1px solid #5b2c94;
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--green);
      font-size: 12px
    }

    .action-panel {
      position: fixed;
      inset: 0;
      background: #000a;
      display: none;
      z-index: 5;
      overflow: auto;
      padding: 24px
    }

    .action-panel.open {
      display: block
    }

    .action-card {
      max-width: 720px;
      margin: 4vh auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow)
    }

    .action-card h2 {
      margin: 0 0 8px
    }

    .action-card p {
      color: var(--muted)
    }

    .action-card select,
    .action-card input {
      background: #0f081c;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px;
      border-radius: 9px;
      max-width: 100%
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 20px
    }

    .action-card button {
      background: #26153f;
      border: 1px solid #43296a;
      border-radius: 9px;
      padding: 9px 12px
    }

    .action-card .close-actions {
      float: right
    }

    #actionResults,
    #actionLog {
      max-height: 28vh;
      overflow: auto;
      padding-left: 20px;
      color: #d0c5e4
    }

    .result-item {
      margin: 8px 0;
      overflow-wrap: anywhere
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 99px
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e5bd70;
      box-shadow: 0 0 10px #e5bd7070
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 10px #c9a6ff80
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: #b3a5cf
    }

    .icon-btn:hover {
      background: var(--panel-2);
      color: var(--text)
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 650px;
      padding: 58px 16px 45px
    }

    .orb {
      margin: 0 auto 23px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 40% 38%, #6a1bb0, #3a0766 65%, #170a26);
      border: 1px solid #c9a6ff4d;
      box-shadow: 0 0 55px #8b3fd630, inset 0 0 22px #c9a6ff12;
      color: var(--green);
      font: 48px Georgia, serif;
      animation: breath 4s ease-in-out infinite
    }

    @keyframes breath {
      50% {
        box-shadow: 0 0 75px #8b3fd655, inset 0 0 28px #c9a6ff20
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 5vw, 40px);
      font-weight: 560;
      letter-spacing: -.04em
    }

    .intro {
      color: var(--muted);
      margin: 11px 0 27px;
      font-size: 15px
    }

    .suggestions {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap
    }

    .chip {
      background: #1a0f2e;
      border: 1px solid #43296a;
      color: #d3c8e8;
      border-radius: 99px;
      padding: 9px 14px;
      font-size: 12px;
      transition: .2s
    }

    .chip:hover {
      border-color: #c9a6ff88;
      color: var(--green);
      transform: translateY(-1px)
    }

    .conversation {
      display: none;
      flex-direction: column;
      gap: 23px;
      padding: 30px 3px 26px;
      overflow: auto;
      max-height: calc(100vh - 260px);
      scrollbar-color: #3a2560 transparent
    }

    .conversation.active {
      display: flex
    }

    .message {
      max-width: min(78%, 740px);
      display: flex;
      flex-direction: column;
      gap: 7px;
      animation: appear .22s ease-out
    }

    .message.user {
      align-self: flex-end
    }

    .message.assistant {
      align-self: flex-start
    }

    .speaker {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #8f81ab;
      padding: 0 4px
    }

    .user .speaker {
      text-align: right
    }

    .bubble {
      padding: 14px 17px;
      border-radius: 17px;
      background: #1a0f2e;
      border: 1px solid #33204f;
      color: #ece6f7;
      white-space: pre-wrap;
      overflow-wrap: anywhere
    }

    .user .bubble {
      background: var(--indigo);
      border-color: #7a2fc0;
      color: #fff;
      border-bottom-right-radius: 5px
    }

    .assistant .bubble {
      border-bottom-left-radius: 5px
    }

    .bubble strong {
      color: var(--green);
      font-weight: 650
    }

    .bubble code {
      font-family: ui-monospace, monospace;
      background: #0a0512;
      padding: 2px 5px;
      border-radius: 4px
    }

    .bubble ul {
      margin: 7px 0;
      padding-left: 21px
    }

    .bubble p {
      margin: 0 0 8px
    }

    .bubble p:last-child {
      margin-bottom: 0
    }

    .message-tools {
      display: flex;
      gap: 7px;
      min-height: 27px;
      padding-left: 2px
    }

    .mini-btn {
      border: 0;
      background: transparent;
      color: #8a7ca6;
      padding: 2px 7px;
      font-size: 11px
    }

    .mini-btn:hover {
      color: var(--green)
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center
    }

    .typing i {
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: dot 1s infinite ease-in-out
    }

    .typing i:nth-child(2) {
      animation-delay: .15s
    }

    .typing i:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes dot {
      50% {
        opacity: .25;
        transform: translateY(-3px)
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      padding-top: 15px;
      background: linear-gradient(transparent, var(--bg) 17%)
    }

    .composer {
      border: 1px solid #3a2560;
      background: #170d28;
      border-radius: 20px;
      padding: 11px 12px 10px;
      box-shadow: var(--shadow);
      transition: border-color .2s
    }

    .composer:focus-within {
      border-color: #b07cf080
    }

    .attachment-row {
      display: none;
      gap: 7px;
      flex-wrap: wrap;
      padding: 0 5px 9px
    }

    .attachment-row.has-files {
      display: flex
    }

    .file-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #43296a;
      background: #26153f;
      border-radius: 99px;
      padding: 4px 9px;
      font-size: 11px;
      color: #d6c9ec
    }

    .file-pill button {
      border: 0;
      background: none;
      color: #a798c4;
      padding: 0 1px
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px
    }

    .composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 180px;
      resize: none;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
      padding: 10px 7px;
      line-height: 1.5
    }

    .composer textarea::placeholder {
      color: #85769f
    }

    .tool-btn {
      flex: none;
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 12px;
      color: #ab9cc8;
      transition: .18s
    }

    .tool-btn:hover {
      background: #26153f;
      color: var(--green)
    }

    .tool-btn.recording {
      background: #392522;
      color: var(--danger);
      animation: pulse 1.2s infinite
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 5px #ff9e9119
      }
    }

    .send-btn {
      background: var(--indigo);
      color: #fff;
      border: 0;
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      transition: .2s
    }

    .send-btn:hover {
      background: var(--indigo-2);
      transform: translateY(-1px)
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: wait
    }

    .hint {
      display: flex;
      justify-content: space-between;
      padding: 9px 6px 0;
      color: #76688f;
      font-size: 10px
    }

    .hint span:last-child {
      color: #665981
    }

    .notice {
      margin: 11px auto 0;
      text-align: center;
      color: #76688f;
      font-size: 10px
    }

    .notice b {
      font-weight: 500;
      color: #9588ae
    }

    .alert {
      align-self: center;
      color: var(--danger);
      background: #291b19;
      border: 1px solid #55352e;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 13px;
      max-width: 90%
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: #0009;
      display: none;
      place-items: center;
      padding: 20px;
      z-index: 5
    }

    .modal-bg.open {
      display: grid
    }

    .modal {
      width: min(480px, 100%);
      border: 1px solid var(--line);
      background: #170d28;
      border-radius: 18px;
      padding: 23px;
      box-shadow: var(--shadow)
    }

    .modal h2 {
      margin: 0 0 12px;
      font-size: 18px
    }

    .modal p {
      color: #b3a6cc;
      font-size: 13px
    }

    .modal button {
      margin-top: 10px;
      border: 1px solid #43296a;
      background: #26153f;
      border-radius: 9px;
      padding: 8px 12px
    }

    .modal .close {
      float: right;
      margin: 0;
      padding: 4px 8px
    }

    @media(max-width:620px) {
      .app {
        padding: 15px 14px
      }

      .header-right .status {
        max-width: 150px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis
      }

      .welcome {
        padding: 48px 5px 35px
      }

      .suggestions {
        gap: 7px
      }

      .chip {
        font-size: 11px;
        padding: 8px 11px
      }

      .message {
        max-width: 92%
      }

      .conversation {
        max-height: calc(100vh - 235px)
      }

      .hint {
        font-size: 9px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-icon">A</div>
        <div>
          <div class="brand-name">ABRIL</div>
          <div class="brand-sub">Asistente personal</div>
        </div>
      </div>
      <div class="header-right">
        <div class="status" title="Estado del motor de IA">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Conectando…</span>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="Configuración de Abril"
          title="Configuración">⚙</button>
      </div>
    </header>
    <main>
      <section class="welcome" id="welcome">
        <!-- <div class="orb">A</div> -->
        <h1>Bienvenido Sr. Sarmiento</h1>
        <!--<p class="intro">Puedo ayudarte a pensar, resumir y encontrar patrones en lo que compartas.</p>
        <div class="suggestions">
          <button class="chip"
            data-prompt="Resume las ideas principales de este texto y dime qué debería recordar.">Resumir un
            texto</button>
          <button class="chip"
            data-prompt="Analiza esta información: identifica patrones, contradicciones y preguntas que debería hacerme.">Analizar
            patrones</button>
          <button class="chip"
            data-prompt="Ayúdame a convertir esta idea en un plan claro con pasos concretos y prioridades.">Desarrollar
            una idea</button>
        </div> -->
      </section>
      <section class="conversation" id="conversation" aria-live="polite"></section>
    </main>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <div class="attachment-row" id="attachmentRow"></div>
        <div class="input-row">
          <button class="tool-btn" type="button" id="attachBtn" aria-label="Adjuntar archivo de texto"
            title="Adjuntar .txt, .md o .csv">＋</button>
          <input type="file" id="fileInput"
            accept=".txt,.md,.csv,.json,.log,text/plain,text/markdown,text/csv,application/json" multiple hidden>
          <textarea id="prompt" rows="1" placeholder="Pregúntame algo o comparte lo que estás pensando…"
            aria-label="Mensaje para Abril"></textarea>
          <button class="tool-btn" type="button" id="micBtn" aria-label="Dictar mensaje"
            title="Dictar mensaje">◉</button>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Enviar"><svg width="17" height="17"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg></button>
        </div>
      </form>
      <div class="hint"><span>Enter para enviar · Shift + Enter para nueva línea</span><span id="voiceHint">Voz
          disponible en navegadores compatibles</span></div>
      <div class="notice">Abril solo realiza acciones locales que seleccionas explícitamente.</div>
    </div>
  </div>
  <div class="modal-bg" id="modalBg">
    <div class="modal" style="max-width:640px;max-height:70vh;overflow:auto"><button class="close" id="closeModal">×</button>
      <h2>Configuración de Abril</h2>
      <div id="providerInfo" style="white-space:pre-wrap;font-size:13px;line-height:1.6"></div>
      <button id="clearBtn">Limpiar conversación</button>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const prompt = $('prompt'), form = $('form'), sendBtn = $('sendBtn'), conversation = $('conversation'), welcome = $('welcome');
    const history = []; let pendingFiles = []; let busy = false; let recognition = null;
    const esc = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function formatText(text) {
      let html = esc(text).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      return html.split('\n').map(line => line.startsWith('- ') ? '• ' + line.slice(2) : line).join('<br>');
    }
    function showConversation() { welcome.style.display = 'none'; conversation.classList.add('active'); }
    function addMessage(role, text, waiting = false) {
      showConversation();
      const box = document.createElement('article'); box.className = 'message ' + role;
      const label = role === 'user' ? 'Tú' : 'Abril';
      box.innerHTML = `<div class="speaker">${label}</div><div class="bubble">${waiting ? '<span class="typing"><i></i><i></i><i></i></span>' : formatText(text)}</div>`;
      if (role === 'assistant' && !waiting) { const tools = document.createElement('div'); tools.className = 'message-tools'; const speak = document.createElement('button'); speak.className = 'mini-btn'; speak.textContent = '◖ Escuchar'; speak.onclick = () => say(text); tools.appendChild(speak); box.appendChild(tools); }
      conversation.appendChild(box); conversation.scrollTop = conversation.scrollHeight; return box;
    }
    function say(text) { if (!('speechSynthesis' in window)) { setAlert('Este navegador no ofrece lectura de voz.'); return; } window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'es-CO'; window.speechSynthesis.speak(u); }
    function setAlert(text) { const a = document.createElement('div'); a.className = 'alert'; a.textContent = text; conversation.appendChild(a); showConversation(); conversation.scrollTop = conversation.scrollHeight; }
    function resize() { prompt.style.height = 'auto'; prompt.style.height = Math.min(prompt.scrollHeight, 180) + 'px'; }
    prompt.addEventListener('input', resize);
    prompt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    $('attachBtn').onclick = () => $('fileInput').click();
    $('fileInput').addEventListener('change', async e => {
      const files = [...e.target.files];
      for (const file of files) { if (file.size > 500_000) { setAlert(`${file.name} supera 500 KB; no se añadió.`); continue; } try { pendingFiles.push({ name: file.name, text: await file.text() }); } catch { setAlert(`No pude leer ${file.name}.`); } }
      renderFiles(); e.target.value = '';
    });
    function renderFiles() { const row = $('attachmentRow'); row.innerHTML = ''; row.classList.toggle('has-files', pendingFiles.length > 0); pendingFiles.forEach((f, i) => { const pill = document.createElement('span'); pill.className = 'file-pill'; pill.innerHTML = `${esc(f.name)} <button type="button" aria-label="Quitar ${esc(f.name)}">×</button>`; pill.querySelector('button').onclick = () => { pendingFiles.splice(i, 1); renderFiles(); }; row.appendChild(pill); }); }
    form.addEventListener('submit', async e => {
      e.preventDefault(); if (busy) return;
      let text = prompt.value.trim(); if (pendingFiles.length) { const content = pendingFiles.map(f => `\n\n--- Archivo: ${f.name} ---\n${f.text}`).join(''); text = (text || 'Analiza el contenido de los archivos adjuntos. Identifica ideas principales y patrones relevantes.') + content; }
      if (!text) return;
      const userText = text; history.push({ role: 'user', content: userText }); addMessage('user', userText); pendingFiles = []; renderFiles(); prompt.value = ''; resize(); busy = true; sendBtn.disabled = true;
      const wait = addMessage('assistant', '', true);
      try { const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) }); const data = await response.json(); wait.remove(); if (!response.ok) throw new Error(data.error || 'No se pudo conectar con Abril.'); history.push({ role: 'assistant', content: data.answer }); addMessage('assistant', data.answer); }
      catch (error) { wait.remove(); setAlert(error.message + ' Si acabas de iniciar Abril, revisa el motor configurado en la terminal.'); history.pop(); }
      finally { busy = false; sendBtn.disabled = false; prompt.focus(); }
    });
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) { recognition = new SpeechRecognition(); recognition.lang = 'es-CO'; recognition.interimResults = true; recognition.continuous = false; recognition.onresult = e => { let final = ''; for (let i = e.resultIndex; i < e.results.length; i++)final += e.results[i][0].transcript; prompt.value = final; resize(); }; recognition.onend = () => $('micBtn').classList.remove('recording'); recognition.onerror = e => { $('micBtn').classList.remove('recording'); setAlert(e.error === 'not-allowed' ? 'El navegador no tiene permiso para usar el micrófono.' : 'No se pudo reconocer la voz.'); }; $('micBtn').onclick = () => { try { recognition.start(); $('micBtn').classList.add('recording'); } catch { recognition.stop(); } }; }
    else { $('micBtn').onclick = () => setAlert('Este navegador no ofrece dictado por voz. Prueba Chromium o Chrome y permite el micrófono para localhost.'); $('voiceHint').textContent = 'Dictado no compatible en este navegador'; }
    async function api(path, payload, method) { const response = await fetch(path, { method: method || (payload ? 'POST' : 'GET'), headers: payload || method ? { 'Content-Type': 'application/json' } : {}, body: payload ? JSON.stringify(payload) : undefined }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'No se pudo completar la acción.'); return data; }
    async function openConfig() {
      try {
        const [status, prefs, routines] = await Promise.all([
          api('/api/status'),
          api('/api/memory/preferences'),
          api('/api/memory/routines'),
        ]);
        const lines = [`Motor: ${status.provider} · ${status.model}.`];
        lines.push('—');
        const prefEntries = Object.entries(prefs.preferences || {});
        if (prefEntries.length) {
          lines.push('Preferencias guardadas:');
          prefEntries.forEach(([k, v]) => lines.push(`  ${k} = ${v}`));
        } else {
          lines.push('Sin preferencias guardadas.');
        }
        lines.push('—');
        const routineList = routines.routines || [];
        if (routineList.length) {
          lines.push('Rutinas:');
          routineList.forEach(r => lines.push(`  ${r.name}${r.description ? ' — ' + r.description : ''} [${r.confirmed ? 'confirmada' : 'pendiente'}]`));
        } else {
          lines.push('Sin rutinas guardadas.');
        }
        $('providerInfo').innerHTML = lines.map(l => `<div>${esc(l)}</div>`).join('');
      } catch {
        $('providerInfo').textContent = 'No se pudo cargar la configuración.';
      }
      $('modalBg').classList.add('open');
    }
    $('settingsBtn').onclick = openConfig;
    $('closeModal').onclick = () => $('modalBg').classList.remove('open');
    $('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) $('modalBg').classList.remove('open'); });
    $('clearBtn').onclick = () => { history.length = 0; conversation.innerHTML = ''; conversation.classList.remove('active'); welcome.style.display = 'block'; window.speechSynthesis?.cancel(); $('modalBg').classList.remove('open'); };
    document.querySelectorAll('.chip').forEach(chip => chip.onclick = () => { prompt.value = chip.dataset.prompt; resize(); prompt.focus(); });
    fetch('/api/status').then(r => r.json()).then(s => { if (s.ready) { $('statusText').textContent = `${s.provider} · ${s.model}`; $('statusDot').classList.add('ok'); } else { $('statusText').textContent = s.status_message || 'Motor no disponible'; $('statusDot').classList.remove('ok'); } }).catch(() => { $('statusText').textContent = 'Sin servidor'; });
  </script>
</body>

</html>
